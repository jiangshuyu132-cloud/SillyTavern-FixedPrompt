<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>固定提示词 · 浏览器验证</title>
<link rel="stylesheet" href="../style.css">
<style>
    :root { color-scheme: dark; }
    body { margin: 20px; font: 16px/1.5 system-ui; color: #c1b8a2; background: #101113; }
    h1 { margin: 0; font-size: 20px; }
    #result, .instructions { font-size: 13px; }
    #chat { position: absolute; top: 220px; bottom: 32px; left: max(0px, calc((100% - 900px) / 2)); width: min(100%, 900px); box-sizing: border-box; padding: 32px; background: #171717; overflow: auto; border: 1px solid #302c25; }
    #chat p { max-width: 720px; margin-bottom: 24px; }
    #wire { white-space: pre-wrap; overflow-wrap: anywhere; }
    #extensions_settings2 { display: none; }
    textarea, button, select { background: red; color: lime; border-radius: 40px; }
    /* Deliberately conflicting page controls must not affect the shadow panel. */
    #send, #message { padding: 8px 12px; }
</style>
<h1>固定提示词 · 浏览器验证</h1>
<p class="instructions">独立示例，不连接酒馆或模型服务。点击金色长条展开，再点击右上角「收起」查看 3.5 秒不规则消散。模拟发送后可在「高级设置」预览并复制。</p>
<label>用户消息 <input id="message" value="带我去城门。"></label>
<button id="send" type="button">模拟发送</button>
<p id="result" role="status">正在加载……</p>
<div id="extensions_settings2"></div>
<main id="chat" aria-label="示例聊天">
    <p>这是一段用于检查悬浮位置的示例聊天。金色长条贴在正文左边。</p>
    <p>主面板展开成正方形，高级设置继续向下展开。缩窄窗口可检查手机布局。</p>
    <p>模拟请求：</p><pre id="wire">点击「模拟发送」查看组合后的请求。</pre>
</main>
<script type="module">
    const handlers = new Map();
    const key = 'fixed_prompt_extension';
    const result = document.getElementById('result');
    const state = {
        extensionSettings: { [key]: { enabled: true, text: '请用简体中文回复。', role: 0, depth: 0 } },
        extensionPrompts: {}, chat: [],
        name1: '旅人', name2: '向导', mainApi: 'openai',
        eventTypes: { GENERATION_AFTER_COMMANDS: 'generate', CHAT_CHANGED: 'chat',
            CHAT_COMPLETION_SETTINGS_READY: 'request', GENERATION_ENDED: 'ended',
            GENERATION_STOPPED: 'stopped', GENERATE_AFTER_DATA: 'data' },
        eventSource: {
            on(name, handler) { if (!handlers.has(name)) handlers.set(name, new Set()); handlers.get(name).add(handler); },
            removeListener(name, handler) { handlers.get(name)?.delete(handler); },
            makeLast(name, handler) { this.removeListener(name, handler); this.on(name, handler); },
        },
        saveSettingsDebounced() { result.textContent = '设置已保存到本示例的内存中。'; },
    };
    globalThis.SillyTavern = { getContext: () => state };
    const emit = (name, ...args) => { for (const handler of handlers.get(name) ?? []) handler(...args); };
    try {
        const extension = await import('../index.js');
        extension.init();
        result.textContent = 'v1.2.1 已就绪。可查看粒子展开和消散、模拟发送、预览并复制。';
        document.getElementById('send').addEventListener('click', () => {
            const text = document.getElementById('message').value;
            emit('generate', 'normal', {}, false);
            state.chat = [{ is_user: true, is_system: false, mes: text }];
            const coreChat = state.chat.map(message => ({ ...message }));
            globalThis.sillytavernFixedPromptInterceptor(coreChat, 8192, () => {}, 'normal');
            const request = { type: 'normal', messages: coreChat.map(message => ({
                role: message.is_user ? 'user' : 'assistant', content: message.mes,
            })) };
            emit('request', request);
            document.getElementById('wire').textContent = JSON.stringify(request, null, 2);
            emit('ended');
            result.textContent = state.chat[0].mes === text ? '模拟发送完成，原始聊天文字保持不变。' : '错误：原始聊天被修改。';
        });
    } catch (error) {
        result.textContent = '加载失败：' + error.message;
        console.error(error);
    }
</script>
</html>
